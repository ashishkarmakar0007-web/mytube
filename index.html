<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>MyTube — Watch Together</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#090b12;--panel:#121622;--panel2:#191f2d;--text:#f5f7fb;--muted:#9ba5b7;--line:#252c3b;--accent:#ff3158}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:white;font-weight:700}
    button.secondary{background:var(--panel2);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}
    .top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#090b12ed;backdrop-filter:blur(14px);z-index:5}
    .brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--accent)}.topright{display:flex;gap:9px;align-items:center}
    .wrap{max-width:1180px;margin:auto;padding:22px 18px 90px}.hero{padding:25px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 85% 10%,#492033 0,transparent 34%),linear-gradient(135deg,#171d2b,#10131d)}
    h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 9px}.muted{color:var(--muted)}.hero p{margin:0 0 18px;color:#c4cada}
    .tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:180px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .sectionhead{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.sectionhead h2{font-size:20px;margin:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.video{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}
    .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#202636;display:block}.vbody{padding:12px 13px 15px}.vtitle{font-weight:750;margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .meta{font-size:12px;color:var(--muted)}.empty{padding:35px;text-align:center;border:1px dashed #394153;border-radius:18px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}
    .dialog{width:min(100%,460px);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
    .dialog h2{margin:0 0 14px}.field{display:block;width:100%;margin:9px 0 13px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0d111b;color:var(--text)}
    textarea.field{min-height:90px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.status{min-height:22px;color:#ffc2ce;font-size:13px;margin-top:9px}
    .player{width:100%;max-height:70vh;background:#000;border-radius:14px}.close{float:right;background:var(--panel2);padding:7px 11px}
    .bottom{display:none}
    @media(max-width:650px){.wrap{padding:15px 13px 90px}.top{padding:0 13px}.hero{padding:20px}.grid{grid-template-columns:1fr;gap:13px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101521f5;border-top:1px solid var(--line);justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:transparent;color:#dce2ee;padding:7px;font-size:12px}.bottom button span{display:block;font-size:18px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">My<span>Tube</span></div>
    <div class="topright"><span id="userLabel" class="muted"></span><button id="authBtn" onclick="openAuth()">Login</button></div>
  </header>
  <main class="wrap">
    <section class="hero">
      <h1>Discover. Watch. Share.</h1>
      <p>Your videos, your community. Welcome to MyTube.</p>
      <button onclick="openUpload()">＋ Upload video</button>
    </section>
    <div class="tools">
      <input id="search" class="search" placeholder="Search videos..." oninput="renderVideos()">
      <button class="secondary" onclick="loadVideos()">Refresh</button>
    </div>
    <div class="sectionhead"><h2>Latest videos</h2><span id="count" class="muted"></span></div>
    <section id="videoGrid" class="grid"><div class="empty">Loading MyTube videos…</div></section>
  </main>
  <nav class="bottom">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Home</button>
    <button onclick="document.getElementById('search').focus()"><span>⌕</span>Search</button>
    <button onclick="openUpload()"><span>⊕</span>Upload</button>
    <button onclick="openAuth()"><span>◉</span>Account</button>
  </nav>

  <div class="modal" id="authModal">
    <div class="dialog">
      <button class="close" onclick="closeModal('authModal')">✕</button>
      <h2 id="authTitle">Login to MyTube</h2>
      <input id="email" class="field" type="email" placeholder="Email address" autocomplete="email">
      <input id="password" class="field" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password">
      <div class="actions">
        <button onclick="signIn()">Login</button>
        <button class="secondary" onclick="signUp()">Create account</button>
      </div>
      <div id="authStatus" class="status"></div>
    </div>
  </div>

  <div class="modal" id="uploadModal">
    <div class="dialog">
      <button class="close" onclick="closeModal('uploadModal')">✕</button>
      <h2>Upload a video</h2>
      <input id="videoTitle" class="field" placeholder="Video title">
      <textarea id="videoDescription" class="field" placeholder="Description (optional)"></textarea>
      <label class="muted">Video file</label><input id="videoFile" class="field" type="file" accept="video/*">
      <label class="muted">Thumbnail image (optional)</label><input id="thumbFile" class="field" type="file" accept="image/*">
      <button id="uploadButton" onclick="uploadVideo()">Upload to MyTube</button>
      <div id="uploadStatus" class="status"></div>
    </div>
  </div>

  <div class="modal" id="playerModal">
    <div class="dialog" style="width:min(100%,850px)">
      <button class="close" onclick="closePlayer()">✕</button>
      <h2 id="playerTitle">MyTube Player</h2>
      <video id="player" class="player" controls playsinline></video>
      <p id="playerDescription" class="muted"></p>
    </div>
  </div>

<script>
  // Add your own Supabase Project URL and Publishable Key here.
  const SUPABASE_URL = "https://pwyucodxxrbpskdzqnas.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Yuf3QnnbAsGiqjO6Pz1wXw_UXyd5iIC";
  const VIDEO_BUCKET = "videos";
  const THUMB_BUCKET = "thumbnails";

  let db = null, currentUser = null, videos = [];

  function setStatus(id, message) { document.getElementById(id).textContent = message; }
  function showModal(id) { document.getElementById(id).classList.add("show"); }
  function closeModal(id) { document.getElementById(id).classList.remove("show"); }
  function configReady() {
    return SUPABASE_URL.startsWith("https://") && !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");
  }
  if (configReady() && window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    db.auth.getSession().then(({data}) => updateUser(data.session?.user || null));
    db.auth.onAuthStateChange((_event, session) => { updateUser(session?.user || null); });
    loadVideos();
  } else {
    document.getElementById("videoGrid").innerHTML =
      '<div class="empty">Setup needed: paste your Supabase Project URL and Publishable Key in this file, then reload.</div>';
  }

  function updateUser(user) {
    currentUser = user;
    document.getElementById("userLabel").textContent = user ? (user.email || "Signed in") : "";
    document.getElementById("authBtn").textContent = user ? "Logout" : "Login";
    if (user) closeModal("authModal");
  }
  function openAuth() {
    if (currentUser) { db.auth.signOut(); return; }
    showModal("authModal");
  }
  async function signUp() {
    if (!db) return;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || password.length < 6) return setStatus("authStatus","Enter a valid email and password of at least 6 characters.");
    const {error} = await db.auth.signUp({email,password});
    setStatus("authStatus", error ? error.message : "Signup submitted. Check your email if confirmation is enabled.");
  }
  async function signIn() {
    if (!db) return;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const {error} = await db.auth.signInWithPassword({email,password});
    setStatus("authStatus", error ? error.message : "Login successful.");
  }

  async function loadVideos() {
    if (!db) return;
    const grid = document.getElementById("videoGrid");
    grid.innerHTML = '<div class="empty">Loading videos…</div>';
    const {data,error} = await db.from("videos").select("*").order("created_at",{ascending:false}).limit(60);
    if (error) { grid.innerHTML = '<div class="empty">Could not load videos: '+escapeHtml(error.message)+'</div>'; return; }
    videos = data || [];
    for (const v of videos) {
      const {data:signed} = await db.storage.from(VIDEO_BUCKET).createSignedUrl(v.video_url,3600);
      v.playUrl = signed?.signedUrl || "";
    }
    renderVideos();
  }
  function renderVideos() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    const filtered = videos.filter(v => (v.title||"").toLowerCase().includes(q) || (v.description||"").toLowerCase().includes(q));
    document.getElementById("count").textContent = filtered.length + " videos";
    const grid = document.getElementById("videoGrid");
    if (!filtered.length) { grid.innerHTML = '<div class="empty">No videos yet. Sign in and upload the first MyTube video!</div>'; return; }
    grid.innerHTML = filtered.map(v => `
      <article class="video">
        <img class="thumb" src="${escapeAttr(v.thumbnail_url || '')}" alt="" onerror="this.style.display='none'">
        <div class="vbody">
          <p class="vtitle">${escapeHtml(v.title)}</p>
          <div class="meta">${Number(v.views||0).toLocaleString()} views · ${new Date(v.created_at).toLocaleDateString()}</div>
          <div style="margin-top:12px"><button class="secondary" onclick="playVideo('${escapeAttr(v.id)}')">▶ Watch</button></div>
        </div>
      </article>`).join("");
  }
  function playVideo(id) {
    const v = videos.find(item => item.id === id);
    if (!v || !v.playUrl) return alert("Video link is unavailable. Sign in, then refresh the page.");
    document.getElementById("playerTitle").textContent = v.title;
    document.getElementById("playerDescription").textContent = v.description || "";
    const player = document.getElementById("player");
    player.src = v.playUrl;
    showModal("playerModal");
    player.play().catch(()=>{});
  }
  function closePlayer() {
    const player = document.getElementById("player");
    player.pause(); player.removeAttribute("src"); player.load();
    closeModal("playerModal");
  }
  function openUpload() {
    if (!currentUser) { showModal("authModal"); setStatus("authStatus","Please login before uploading."); return; }
    showModal("uploadModal");
  }
  async function uploadVideo() {
    if (!currentUser) return setStatus("uploadStatus","Please login first.");
    const title = document.getElementById("videoTitle").value.trim();
    const video = document.getElementById("videoFile").files[0];
    const thumb = document.getElementById("thumbFile").files[0];
    const btn = document.getElementById("uploadButton");
    if (!title || !video) return setStatus("uploadStatus","Add a title and choose a video file.");
    if (video.size > 250 * 1024 * 1024) return setStatus("uploadStatus","For this starter version, choose a video under 250 MB.");
    btn.disabled = true; setStatus("uploadStatus","Uploading video… please keep this page open.");
    const folder = currentUser.id;
    const videoPath = folder + "/" + crypto.randomUUID() + "-" + safeName(video.name);
    const {error:videoError} = await db.storage.from(VIDEO_BUCKET).upload(videoPath,video,{contentType:video.type || "video/mp4",upsert:false});
    if (videoError) { btn.disabled=false; return setStatus("uploadStatus",videoError.message); }
    let thumbUrl = "";
    if (thumb) {
      setStatus("uploadStatus","Video uploaded. Uploading thumbnail…");
      const thumbPath = folder + "/" + crypto.randomUUID() + "-" + safeName(thumb.name);
      const {error:thumbError} = await db.storage.from(THUMB_BUCKET).upload(thumbPath,thumb,{contentType:thumb.type,upsert:false});
      if (!thumbError) thumbUrl = db.storage.from(THUMB_BUCKET).getPublicUrl(thumbPath).data.publicUrl;
    }
    setStatus("uploadStatus","Saving video details…");
    const {error:rowError} = await db.from("videos").insert({
      user_id: currentUser.id, title, description: document.getElementById("videoDescription").value.trim(),
      video_url: videoPath, thumbnail_url: thumbUrl
    });
    btn.disabled=false;
    if (rowError) return setStatus("uploadStatus","Video file uploaded, but database save failed: "+rowError.message);
    setStatus("uploadStatus","Upload complete!");
    document.getElementById("videoTitle").value="";
    document.getElementById("videoDescription").value="";
    document.getElementById("videoFile").value="";
    document.getElementById("thumbFile").value="";
    await loadVideos();
    setTimeout(()=>closeModal("uploadModal"),900);
  }
  function safeName(name) { return name.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-90); }
  function escapeHtml(s) { return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function escapeAttr(s) { return escapeHtml(s).replace(/`/g,""); }
</script>
</body>
</html>
